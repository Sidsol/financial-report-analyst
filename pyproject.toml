[project]
name = "financial-report-analyst"
version = "0.1.0"
description = "LlamaIndex RAG over public-company 10-K filings (Microsoft, Apple, NVIDIA) — class project for Labs 7.1/7.2/7.3"
authors = [
    { name = "Jonah Martinez", email = "jonah.martinez@bellevuecollege.edu" },
]
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "llama-index-core>=0.12.0,<0.14",
    "llama-index-llms-openai>=0.3.0,<0.5",
    "llama-index-llms-openai-like>=0.3.0,<0.5",
    "llama-index-embeddings-huggingface>=0.4.0,<0.6",
    "llama-index-readers-file>=0.4.0,<0.5",
    "sentence-transformers>=3.0",
    # Use CPU-only torch; the cpu index is configured under [tool.uv.sources] below.
    "torch>=2.2,<3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "requests>=2.32",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "tabulate>=0.9",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "financial_analyst"
module-root = "src"

# Use the PyTorch CPU wheel index on Windows to avoid pulling ~2GB CUDA libs.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
