# ---------------------------------------------------------------------------
# Retrieval evaluation question set.
#
# Each question has DUAL ground truth:
#   - expected[].{company, fiscal_year, section_id} — coarse metadata target
#   - expected[].must_contain_any — list of substrings (case-insensitive);
#     at least one must appear in the retrieved chunk for a "strict" match.
#
# Metrics:
#   - Metadata Hit@k / MRR — retrieved chunk metadata matches expected tuple
#   - Strict Hit@k / MRR   — metadata matches AND chunk contains a keyword
#
# Categories: single | comparison_year | comparison_company | risk | strategy
#
# Ground-truth labels are author-judged (this is a class project), so the
# strict metric is the more defensible measure of "actually retrieved the
# answer-bearing chunk".
# ---------------------------------------------------------------------------

questions:
  # ---------------------- Single-company, single-year (10) ----------------- #
